name: Repair Growth Counters

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPAIR GROWTH COUNTERS"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: get-player-data-main
  cancel-in-progress: false

jobs:
  repair-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REPAIR GROWTH COUNTERS" ]; then
            echo "Confirmation must be exactly: REPAIR GROWTH COUNTERS" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the published database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python tools/fetch_db_from_release.py \
            --out data/db/ratings.sqlite \
            --require-schema-version 3 \
            --attempts 3 \
            --retry-delay 10

      - name: Back up the database before repair
        run: |
          python tools/compress_db.py \
            --db data/db/ratings.sqlite \
            --out data/db/ratings.before-growth-repair.sqlite.gz

      - name: Upload the pre-repair backup
        uses: actions/upload-artifact@v4
        with:
          name: database-before-growth-repair-${{ github.run_id }}
          path: data/db/ratings.before-growth-repair.sqlite.gz
          retention-days: 30
          if-no-files-found: error

      - name: Normalize wrapped counter history
        run: |
          python tools/normalize_counter_wraps.py \
            --db data/db/ratings.sqlite

      - name: Rebuild wrap-safe best growth rankings
        run: |
          python tools/rebuild_best_growth_safe.py \
            --db data/db/ratings.sqlite \
            --window-days 30 \
            --max-gap-hours 26

      - name: Read repaired database metadata
        id: repaired
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import sqlite3
          from pathlib import Path

          path = Path("data/db/ratings.sqlite")
          conn = sqlite3.connect(path)
          try:
              latest = conn.execute(
                  "SELECT filename FROM snapshots ORDER BY ts DESC LIMIT 1"
              ).fetchone()
              count = int(conn.execute("SELECT COUNT(*) FROM snapshots").fetchone()[0])
          finally:
              conn.close()

          digest = hashlib.sha256()
          with path.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          latest_name = str(latest[0]) if latest else ""
          value = digest.hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"latest_snapshot={latest_name}\n")
              output.write(f"snapshot_count={count}\n")
              output.write(f"sha256={value}\n")
          print(
              f"Repaired database: latest={latest_name}, snapshots={count}, sha256={value}"
          )
          PY

      - name: Compress the repaired database
        run: |
          python tools/compress_db.py \
            --db data/db/ratings.sqlite \
            --out data/db/ratings.sqlite.gz

      - name: Upload the repaired database backup
        uses: actions/upload-artifact@v4
        with:
          name: database-after-growth-repair-${{ github.run_id }}
          path: data/db/ratings.sqlite.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish the repaired database in GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: db-latest
          name: Database (latest)
          allowUpdates: true
          replacesArtifacts: true
          artifacts: data/db/ratings.sqlite.gz

      - name: Verify the published database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          rm -f data/db/published.sqlite
          python tools/fetch_db_from_release.py \
            --out data/db/published.sqlite \
            --expect-latest-snapshot "${{ steps.repaired.outputs.latest_snapshot }}" \
            --minimum-snapshot-count "${{ steps.repaired.outputs.snapshot_count }}" \
            --expect-sha256 "${{ steps.repaired.outputs.sha256 }}" \
            --attempts 6 \
            --retry-delay 10

      - name: Trigger Render after publication
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X GET "$RENDER_DEPLOY_HOOK_URL"
