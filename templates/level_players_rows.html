{% for player in players %}
<tr data-nickname="{{ (player.name or '')|lower|e }}">
  <td class="rank-cell">
    {% set idx = start_index + loop.index %}
    {% if idx == 1 %}🥇{% elif idx == 2 %}🥈{% elif idx == 3 %}🥉{% else %}{{ idx }}{% endif %}
  </td>
  <td class="wide-name shorten">
    <a href="https://playwekings.mobi/hero/detail?player={{ player.pid }}" target="_blank" rel="noopener"><span class="name-ellipsis">{{ player.name }}</span></a>
  </td>
  <td class="tight stat-cell">{{ player.strength }}</td>
  <td class="tight stat-cell">{{ player.defense }}</td>
  <td class="tight stat-cell">{{ player.dexterity }}</td>
  <td class="tight stat-cell">{{ player.mastery }}</td>
  <td class="tight stat-cell">{{ player.vitality }}</td>
</tr>
{% endfor %}
