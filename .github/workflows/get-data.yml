name: Get Player Data

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: get-player-data-main
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser, database and web tests
        run: |
          python -m unittest discover -s tests -v

      - name: Restore the previous database release
        id: restored_db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python tools/fetch_db_from_release.py --optional --out data/db/ratings.sqlite
          python - <<'PY'
          import hashlib
          import os
          import sqlite3
          from pathlib import Path

          path = Path("data/db/ratings.sqlite")
          if not path.exists():
              count = 0
              latest = ""
              digest = ""
          else:
              conn = sqlite3.connect(path)
              try:
                  count = int(conn.execute("SELECT COUNT(*) FROM snapshots").fetchone()[0])
                  row = conn.execute(
                      "SELECT filename FROM snapshots ORDER BY ts DESC LIMIT 1"
                  ).fetchone()
                  latest = str(row[0]) if row else ""
              finally:
                  conn.close()
              sha = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      sha.update(chunk)
              digest = sha.hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"snapshot_count={count}\n")
              output.write(f"latest_snapshot={latest}\n")
              output.write(f"sha256={digest}\n")
          print(f"Restored database: snapshots={count}, latest={latest}, sha256={digest}")
          PY

      - name: Repair corrupted names in the restored database
        run: |
          python tools/profile_name_guard.py repair-db \
            --db data/db/ratings.sqlite \
            --optional

      - name: Collect API players and parse missing or new IDs
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          DB_PATH: data/db/ratings.sqlite
          MIN_BASELINE_SUCCESS_RATIO: "0.995"
          HEROES_API_ATTEMPTS: "4"
          HEROES_API_RETRY_DELAY_SECONDS: "5"
          HEROES_API_TIMEOUT_SECONDS: "45"
          HEROES_API_MIN_PLAYER_COUNT: "100"
          COLLECT_RETRIES: "2"
          ACHIEVEMENT_RETRIES: "1"
          COLLECT_CONCURRENCY: "40"
          SYSTEMIC_FAILURE_SAMPLE_SIZE: "200"
          NEW_PLAYER_PROBE_COUNT: "300"
        run: |
          python collect_api_first.py --db-path data/db/ratings.sqlite

      - name: Upload collection diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-collection-${{ github.run_id }}
          path: |
            data/last_failed_collection.json
            data/failed_html/
          retention-days: 7
          if-no-files-found: warn

      - name: Locate collection files
        id: collection
        shell: bash
        run: |
          snapshot="$(find data -maxdepth 1 -type f -name 'heroes_*.json.gz' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          metadata="${snapshot%.json.gz}.meta.json"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Validate collected player names
        run: |
          python tools/profile_name_guard.py validate-snapshot \
            --snapshot "${{ steps.collection.outputs.snapshot }}"

      - name: Back up the raw collection for thirty days
        uses: actions/upload-artifact@v4
        with:
          name: latest-collection-${{ github.run_id }}
          path: |
            ${{ steps.collection.outputs.snapshot }}
            ${{ steps.collection.outputs.metadata }}
          retention-days: 30
          if-no-files-found: error

      - name: Incrementally update SQLite
        run: |
          python tools/build_db.py \
            --data-dir data \
            --db-path data/db/ratings.sqlite \
            --best-window-days 30 \
            --max-gap-hours 26

      - name: Verify database history was preserved
        id: built_db
        env:
          RESTORED_SNAPSHOT_COUNT: ${{ steps.restored_db.outputs.snapshot_count }}
          RESTORED_LATEST_SNAPSHOT: ${{ steps.restored_db.outputs.latest_snapshot }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import sqlite3
          from pathlib import Path

          path = Path("data/db/ratings.sqlite")
          restored_count = int(os.environ.get("RESTORED_SNAPSHOT_COUNT") or 0)
          restored_latest = os.environ.get("RESTORED_LATEST_SNAPSHOT") or ""

          conn = sqlite3.connect(path)
          try:
              count = int(conn.execute("SELECT COUNT(*) FROM snapshots").fetchone()[0])
              row = conn.execute(
                  "SELECT filename FROM snapshots ORDER BY ts DESC LIMIT 1"
              ).fetchone()
              latest = str(row[0]) if row else ""
              if restored_count and count < restored_count + 1:
                  raise RuntimeError(
                      f"Database history was lost: restored={restored_count}, built={count}"
                  )
              if restored_latest:
                  exists = conn.execute(
                      "SELECT 1 FROM snapshots WHERE filename=?",
                      (restored_latest,),
                  ).fetchone()
                  if not exists:
                      raise RuntimeError(
                          f"Previous latest snapshot disappeared: {restored_latest}"
                      )
              check = conn.execute("PRAGMA quick_check").fetchone()[0]
              if check != "ok":
                  raise RuntimeError(f"SQLite quick_check failed: {check}")
          finally:
              conn.close()

          sha = hashlib.sha256()
          with path.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  sha.update(chunk)
          digest = sha.hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"snapshot_count={count}\n")
              output.write(f"latest_snapshot={latest}\n")
              output.write(f"sha256={digest}\n")
          print(f"Built database: snapshots={count}, latest={latest}, sha256={digest}")
          PY

      - name: Compress and validate SQLite
        run: |
          python tools/compress_db.py \
            --db data/db/ratings.sqlite \
            --out data/db/ratings.sqlite.gz

      - name: Back up the complete database for thirty days
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: data/db/ratings.sqlite.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish the database in GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: db-latest
          name: Database (latest)
          allowUpdates: true
          replacesArtifacts: true
          artifacts: data/db/ratings.sqlite.gz

      - name: Verify the published database is the new one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        shell: bash
        run: |
          expected="$(basename "${{ steps.collection.outputs.snapshot }}")"
          rm -f data/db/published.sqlite
          python tools/fetch_db_from_release.py \
            --out data/db/published.sqlite \
            --expect-latest-snapshot "$expected" \
            --minimum-snapshot-count "${{ steps.built_db.outputs.snapshot_count }}" \
            --expect-sha256 "${{ steps.built_db.outputs.sha256 }}" \
            --attempts 6 \
            --retry-delay 10

      - name: Trigger Render only after the release is ready
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X GET "$RENDER_DEPLOY_HOOK_URL"
