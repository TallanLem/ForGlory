name: Repair Current Group Ratings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-group-ratings
  cancel-in-progress: false

jobs:
  repair-current-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore current published database
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python tools/fetch_db_from_release.py \
            --out data/db/ratings.sqlite \
            --attempts 3 \
            --retry-delay 5

      - name: Repair groups in the existing latest snapshot
        id: repair
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          DB_PATH: data/db/ratings.sqlite
          GROUP_REPAIR_ENDPOINT_ATTEMPTS: "2"
          GROUP_REPAIR_CONCURRENCY: "40"
          GROUP_REPAIR_RETRIES: "3"
          GROUP_REPAIR_MIN_PROFILE_SUCCESS_RATIO: "0.995"
          GROUP_REPAIR_MIN_PREVIOUS_GROUP_RATIO: "0.70"
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.repair_current_groups_from_endpoint \
            --db data/db/ratings.sqlite \
            --diagnostics data/group_repair_diagnostics.json

          python - <<'PY'
          import os
          import sqlite3

          conn = sqlite3.connect("data/db/ratings.sqlite")
          try:
              sid, filename = conn.execute(
                  "SELECT snapshot_id,filename FROM snapshots ORDER BY ts DESC LIMIT 1"
              ).fetchone()
              clan_members = conn.execute(
                  "SELECT COUNT(*) FROM observations WHERE snapshot_id=? AND clan_game_id>0",
                  (sid,),
              ).fetchone()[0]
              brotherhood_members = conn.execute(
                  "SELECT COUNT(*) FROM observations WHERE snapshot_id=? AND brotherhood_game_id>0",
                  (sid,),
              ).fetchone()[0]
              clans = conn.execute(
                  "SELECT COUNT(DISTINCT clan_game_id) FROM observations "
                  "WHERE snapshot_id=? AND clan_game_id>0",
                  (sid,),
              ).fetchone()[0]
              brotherhoods = conn.execute(
                  "SELECT COUNT(DISTINCT brotherhood_game_id) FROM observations "
                  "WHERE snapshot_id=? AND brotherhood_game_id>0",
                  (sid,),
              ).fetchone()[0]
              print(
                  f"Repaired existing snapshot {filename}: "
                  f"clan_members={clan_members}, clans={clans}, "
                  f"brotherhood_members={brotherhood_members}, "
                  f"brotherhoods={brotherhoods}"
              )
              if clan_members <= 0 or brotherhood_members <= 0:
                  raise SystemExit("Group repair verification failed")
              if conn.execute("PRAGMA quick_check").fetchone()[0] != "ok":
                  raise SystemExit("SQLite quick_check failed")
          finally:
              conn.close()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"latest_snapshot={filename}\n")
          PY

      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-group-repair-diagnostics-${{ github.run_id }}
          path: |
            data/group_repair_diagnostics.json
            data/group_repair_failed_html
            data/last_failed_collection.json
          retention-days: 7
          if-no-files-found: warn

      - name: Compress repaired database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          python tools/compress_db.py \
            --db data/db/ratings.sqlite \
            --out data/db/ratings.sqlite.gz

          digest="$(sha256sum data/db/ratings.sqlite | awk '{print $1}')"
          count="$(python - <<'PY'
          import sqlite3
          conn = sqlite3.connect('data/db/ratings.sqlite')
          try:
              print(conn.execute('SELECT COUNT(*) FROM snapshots').fetchone()[0])
          finally:
              conn.close()
          PY
          )"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "snapshot_count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish repaired database
        uses: ncipollo/release-action@v1
        with:
          tag: db-latest
          name: Database (latest)
          allowUpdates: true
          replacesArtifacts: true
          artifacts: data/db/ratings.sqlite.gz

      - name: Verify repaired release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          rm -f data/db/published-repair.sqlite
          python tools/fetch_db_from_release.py \
            --out data/db/published-repair.sqlite \
            --expect-latest-snapshot "${{ steps.repair.outputs.latest_snapshot }}" \
            --minimum-snapshot-count "${{ steps.database.outputs.snapshot_count }}" \
            --expect-sha256 "${{ steps.database.outputs.sha256 }}" \
            --attempts 6 \
            --retry-delay 10

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; redeploy Render manually." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X GET "$RENDER_DEPLOY_HOOK_URL"
