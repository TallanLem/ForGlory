name: Keep Render Awake

on:
  schedule:
    # Каждые 5 минут со смещением от начала часа.
    # GitHub использует UTC, но здесь часовой пояс не имеет значения.
    - cron: "2-59/5 * * * *"

  # Позволяет вручную проверить workflow через вкладку Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping ForGlory
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 180 \
            --retry 2 \
            --retry-delay 10 \
            --user-agent "ForGlory-KeepAlive/1.0" \
            --output /dev/null \
            "https://forglory.onrender.com/"