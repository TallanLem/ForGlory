name: Keep Repository Active

on:
  schedule:
    # Check every day; create a commit only after 45 days without activity.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forglory-repository-keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit only after 45 days of inactivity
        shell: bash
        run: |
          set -euo pipefail
          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - last_commit_epoch))
          threshold_seconds=$((45 * 24 * 60 * 60))

          echo "Last commit age: $((age_seconds / 86400)) days."
          if (( age_seconds < threshold_seconds )); then
            echo "No keepalive commit needed."
            exit 0
          fi

          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/repository-keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/repository-keepalive.txt
          git commit -m "chore: keep scheduled workflows active [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
